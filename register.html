<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – Garderobe</title>

  <!-- SAME FONT + ICONS + CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="container top-bar-inner">
      <p>Don't miss our <a href="#">holiday offer</a> – up to <strong>50% OFF!</strong></p>
      <div class="top-social">
        <i class="fa-brands fa-facebook-f"></i>
        <i class="fa-brands fa-instagram"></i>
        <i class="fa-brands fa-twitter"></i>
        <i class="fa-brands fa-pinterest-p"></i>
      </div>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-inner">
      <div class="logo">
        <span class="logo-icon"><i class="fa-solid fa-bag-shopping"></i></span>
        <span class="logo-text">Shahz&Ahd</span>
      </div>

      <nav class="nav" id="mainNav">
        <a href="index.html" class="nav-home">Home</a>
        <a href="shop.html" class="nav-products">Products</a>
        <a href="about.html" class="nav-about">About Us</a>
        <a href="news.html" class="nav-news">News</a>
        <a href="contact.html" class="nav-contact active">Contact</a>
      
      </nav>

      <div class="header-actions">
        <button class="icon-btn"><i class="fa-solid fa-magnifying-glass"></i></button>

        <a href="login.html" class="icon-btn" title="Login">
          <i class="fa-regular fa-user"></i>
        </a>

        <button class="icon-btn"><i class="fa-regular fa-heart"></i></button>

        <a href="cart.html" class="icon-btn cart-btn" title="Cart">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-count" id="cartCount">0</span>
        </a>

        <button class="menu-toggle" id="menuToggle">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- REGISTER CONTENT -->
  <main class="page-wrapper auth-page">
    <section class="section">
      <div class="container auth-layout">
        <div class="auth-card">
          <h1 class="page-hero-title small">Create Account</h1>
          <p class="auth-subtitle">Register to track orders and save your wishlist.</p>

          <form class="auth-form" method="POST" action="backend/auth_register.php" id="registerForm">
  <!-- Username (we store this in DB as "name") -->
  <div class="form-field">
    <label for="regUsername">Username</label>
    <input type="text" id="regUsername" name="name" required aria-describedby="usernameHelp" />
    <small id="usernameHelp" class="field-note">
      Username cannot be "admin".
    </small>
  </div>

  <!-- Full name (front-end only for now) -->
  <div class="form-field">
    <label for="regFullName">Full name</label>
    <input type="text" id="regFullName" name="full_name" />
  </div>

  <!-- Email -->
  <div class="form-field">
    <label for="regEmail">Email</label>
    <input type="email" id="regEmail" name="email" required />
  </div>

  <!-- Phone -->
  <div class="form-field">
    <label for="regPhone">Phone</label>
    <input type="tel" id="regPhone" name="phone" />
  </div>

  <!-- Password -->
  <div class="form-field">
    <label for="regPassword">Password</label>
    <input type="password" id="regPassword" name="password" required />
  </div>

  <!-- Confirm Password -->
  <div class="form-field">
    <label for="regConfirm">Confirm password</label>
    <input type="password" id="regConfirm" name="confirm_password" required />
  </div>

  <!-- I'm not a robot -->
  <div class="form-field">
    <label class="checkbox-inline">
      <input type="checkbox" id="regNotRobot" name="not_robot" />
      I'm not a robot
    </label>
  </div>

  <!-- Error box (real-time) -->
  <p id="registerMessage" aria-live="polite" class="form-message"></p>

  <button type="submit" class="btn btn-primary full-width">Register</button>
</form>



          <p class="auth-bottom">
            Already have an account?
            <a href="login.html" class="auth-link">Login</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer" id="contact">
    <div class="container footer-inner">
      <p>© 2025 – Shahz&Ahd project. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
